name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install uv
        run: pip install uv

      - name: Install package and dev dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Compile source
        run: python -m compileall -q src

      - name: Lint source and tests
        run: python -m ruff check src tests

      - name: Run tests with coverage
        run: python -m pytest tests/ -v --cov=src/siem_log_detector --cov-report=term-missing --cov-fail-under=90

      - name: Verify sample scenario
        run: |
          python -m siem_log_detector sample_logs/auth.log \
            --format json \
            --output build/sample-alerts.json
          python -c "import json; data=json.load(open('build/sample-alerts.json')); assert data['summary']['alerts'] == 3"

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install uv
        run: pip install uv

      - name: Install package and dev dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Run bandit
        run: python -m bandit -r src -ll

      - name: Run safety check
        run: python -m safety check --file pyproject.toml

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install uv
        run: pip install uv

      - name: Install package and dev dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Run benchmark
        run: python benchmarks/run.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: siem-log-detector:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
