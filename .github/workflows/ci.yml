name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Compile source
        run: python -m compileall -q src

      - name: Lint source and tests
        run: python -m ruff check src tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Verify sample scenario
        run: |
          python -m siem_log_detector sample_logs/auth.log \
            --format json \
            --output build/sample-alerts.json
          python -c "import json; data=json.load(open('build/sample-alerts.json')); assert data['summary']['alerts'] == 3"
