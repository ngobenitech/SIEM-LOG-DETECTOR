repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-c", ".bandit.yml"]
        exclude: ^tests/

  - repo: https://github.com/pyupio/safety
    rev: 3.2.11
    hooks:
      - id: safety
        args: ["--file", "pyproject.toml"]
