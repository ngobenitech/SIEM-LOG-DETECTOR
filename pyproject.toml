[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siem-log-detector"
version = "1.0.0"
description = "Time-window correlation of suspicious OpenSSH authentication activity"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Samongelo Elias Ngobeni"},
]
keywords = [
  "blue-team",
  "cybersecurity",
  "detection-engineering",
  "linux",
  "siem",
  "ssh",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pyyaml>=6.0",
  "ruff>=0.5,<1",
  "bandit>=1.7",
  "safety>=3.0",
]

[project.scripts]
siem-detect = "siem_log_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
siem_log_detector = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/siem_log_detector --cov-report=term-missing"
